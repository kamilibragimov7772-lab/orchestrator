name: Core verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and regression tests
        run: python tools/verify.py

      # ResourceWarning is a real defect in this repo (leaked file handles in the
      # inventory tool), so it must fail the build rather than scroll past.
      - name: Tests with warnings promoted to errors
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem hooks,tools/acceptance-gate -Filter *.ps1 -Recurse | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $failed = $true; Write-Error "Parse failed: $($_.Name)" }
          }
          if ($failed) { exit 1 }

      # The gate's deterministic and isolation properties do not need a model:
      # CLI failure, writing outside the allowed root, path traversal, hostile
      # filenames, idempotence and the concurrent lock all run offline. The four
      # model-backed scenarios report `skipped` with a reason, never as passes.
      - name: Acceptance E2E (offline scenarios)
        run: python tools/e2e/harness.py --offline --out e2e-report.json

      - name: Installer dry-run
        shell: bash
        run: |
          python tools/install.py --destination "${RUNNER_TEMP}/stack-plan" \
                                  --vault "${RUNNER_TEMP}/vault-plan" --mode minimal
          test ! -d "${RUNNER_TEMP}/stack-plan" || { echo "plan mode wrote files"; exit 1; }

      - name: Disposable minimal install and doctor
        shell: bash
        run: |
          python tools/install.py --destination "${RUNNER_TEMP}/stack" \
                                  --vault "${RUNNER_TEMP}/vault" --mode minimal --apply
          python tools/doctor.py --root "${RUNNER_TEMP}/stack" --installed

      # __pycache__ is excluded deliberately: doctor.py runs in the step above and
      # leaves byte-code behind, which made a naive file count report the
      # installer as non-idempotent when it is not. Measured locally: runs two
      # and three produce an identical file list.
      - name: Repeat install must add nothing
        shell: bash
        run: |
          count() { find "${RUNNER_TEMP}/stack" -type f -not -path '*/__pycache__/*' | sort; }
          count > /tmp/before.txt
          python tools/install.py --destination "${RUNNER_TEMP}/stack" \
                                  --vault "${RUNNER_TEMP}/vault" --mode minimal --apply
          count > /tmp/after.txt
          diff /tmp/before.txt /tmp/after.txt || { echo "repeat install changed the file set"; exit 1; }

      - name: Working-tree secret scan
        run: python tools/secret_scan.py --root .

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: e2e-report.json
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/fetch_gitleaks.py
      - name: Gitleaks over the whole history
        run: .tools/gitleaks git . --redact=100 --no-banner --log-opts=--all
      - name: Gitleaks over the working tree
        run: .tools/gitleaks dir . --redact=100 --no-banner
